<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Online C Compiler – C Programming Hub</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #ffffff;
        }

        header {
            background: #111827;
            padding: 18px 20px;
            border-bottom: 1px solid #334155;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        header p {
            margin: 6px 0 0;
            color: #94a3b8;
            font-size: 14px;
        }

        .compiler-container {
            width: 95%;
            max-width: 1000px;
            margin: 25px auto;
        }

        .section-title {
            margin-bottom: 10px;
            font-size: 16px;
        }

        textarea {
            width: 100%;
            resize: vertical;
            border: 1px solid #334155;
            border-radius: 8px;
            background: #020617;
            color: #e2e8f0;
            padding: 15px;
            font-family: monospace;
            font-size: 15px;
            line-height: 1.6;
            outline: none;
        }

        #code {
            min-height: 350px;
        }

        #input {
            min-height: 100px;
        }

        textarea:focus {
            border-color: #38bdf8;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        button {
            border: none;
            border-radius: 7px;
            padding: 11px 20px;
            font-size: 15px;
            cursor: pointer;
        }

        #runBtn {
            background: #22c55e;
            color: white;
        }

        #resetBtn {
            background: #334155;
            color: white;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .output-box {
            background: #020617;
            border: 1px solid #334155;
            border-radius: 8px;
            min-height: 180px;
            padding: 15px;
            white-space: pre-wrap;
            overflow-x: auto;
            font-family: monospace;
            color: #e2e8f0;
        }

        .status {
            margin-bottom: 10px;
            color: #38bdf8;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .compiler-container {
                width: 94%;
            }

            #code {
                min-height: 300px;
            }

            textarea {
                font-size: 14px;
            }

            button {
                flex: 1;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>💻 Online C Compiler</h1>
        <p>Write, compile and run C programs directly in your browser.</p>
    </header>

    <main class="compiler-container">

        <div class="section-title">C Code</div>

        <textarea id="code">#include <stdio.h>

int main(void) {
    printf("Hello World\n");
    return 0;
}</textarea>

        <div class="buttons">
            <button id="runBtn">▶ Run Code</button>
            <button id="resetBtn">↻ Reset</button>
        </div>

        <div class="section-title">Program Input</div>

        <textarea
            id="input"
            placeholder="Enter input for your C program here..."
        ></textarea>

        <div class="section-title">Output</div>

        <div class="status" id="status">
            Ready
        </div>

        <div class="output-box" id="output">
            Output will appear here...
        </div>

    </main>
<script>
    const codeEditor = document.getElementById("code");
    const inputBox = document.getElementById("input");
    const runBtn = document.getElementById("runBtn");
    const resetBtn = document.getElementById("resetBtn");
    const outputBox = document.getElementById("output");
    const statusBox = document.getElementById("status");

    const defaultCode = `#include <stdio.h>

int main(void) {
    printf("Hello World\\n");
    return 0;
}`;

    runBtn.addEventListener("click", async () => {

        const code = codeEditor.value.trim();
        const input = inputBox.value;

        if (!code) {
            statusBox.textContent = "Please enter C code.";
            outputBox.textContent = "";
            return;
        }

        runBtn.disabled = true;
        runBtn.textContent = "⏳ Running...";
        statusBox.textContent = "Submitting code...";
        outputBox.textContent = "";

        try {

            // Send the C program to our Vercel API
            const response = await fetch("/api/compile", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    code: code,
                    input: input
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || "Compilation request failed.");
            }

            if (!data.token) {
                throw new Error("Compiler did not return a token.");
            }

            statusBox.textContent = "⏳ Compiling...";

            // Check the compilation result
            await checkResult(data.token);

        } catch (error) {

            statusBox.textContent = "❌ Error";
            outputBox.textContent = error.message;

        } finally {

            runBtn.disabled = false;
            runBtn.textContent = "▶ Run Code";
        }
    });


    async function checkResult(token) {

        const maxAttempts = 20;

        for (let attempt = 0; attempt < maxAttempts; attempt++) {

            await new Promise(resolve => setTimeout(resolve, 700));

            const response = await fetch(
                `/api/compile?token=${encodeURIComponent(token)}`
            );

            const result = await response.json();

            if (!response.ok) {
                throw new Error(
                    result.error || "Unable to get compilation result."
                );
            }

            // Status 1 = In Queue
            // Status 2 = Processing
            if (result.status && result.status.id <= 2) {

                statusBox.textContent =
                    `⏳ ${result.status.description}`;

                continue;
            }

            displayResult(result);
            return;
        }

        throw new Error(
            "Compilation is taking too long. Please try again."
        );
    }


    function displayResult(result) {

        const status = result.status
            ? result.status.description
            : "Unknown";

        statusBox.textContent = `Status: ${status}`;

        let output = "";

        if (result.stdout) {
            output += result.stdout;
        }

        if (result.compile_output) {
            output += result.compile_output;
        }

        if (result.stderr) {
            output += result.stderr;
        }

        if (result.message) {
            output += result.message;
        }

        if (!output) {
            output = "Program finished with no output.";
        }

        outputBox.textContent = output;
    }


    resetBtn.addEventListener("click", () => {

        codeEditor.value = defaultCode;
        inputBox.value = "";
        outputBox.textContent = "Output will appear here...";
        statusBox.textContent = "Ready";

    });
</script>
</body>
</html>
