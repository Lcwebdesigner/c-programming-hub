<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Online C Compiler – C Programming Hub</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #ffffff;
        }

        header {
            background: #111827;
            padding: 18px 20px;
            border-bottom: 1px solid #334155;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        header p {
            margin: 6px 0 0;
            color: #94a3b8;
            font-size: 14px;
        }

        .compiler-container {
            width: 95%;
            max-width: 1000px;
            margin: 25px auto;
        }

        .section-title {
            margin-bottom: 10px;
            font-size: 16px;
        }

        textarea {
            width: 100%;
            resize: vertical;
            border: 1px solid #334155;
            border-radius: 8px;
            background: #020617;
            color: #e2e8f0;
            padding: 15px;
            font-family: monospace;
            font-size: 15px;
            line-height: 1.6;
            outline: none;
        }

        #code {
            min-height: 350px;
        }

        #input {
            min-height: 100px;
        }

        textarea:focus {
            border-color: #38bdf8;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        button {
            border: none;
            border-radius: 7px;
            padding: 11px 20px;
            font-size: 15px;
            cursor: pointer;
        }

        #runBtn {
            background: #22c55e;
            color: white;
        }

        #resetBtn {
            background: #334155;
            color: white;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .output-box {
            background: #020617;
            border: 1px solid #334155;
            border-radius: 8px;
            min-height: 180px;
            padding: 15px;
            white-space: pre-wrap;
            overflow-x: auto;
            font-family: monospace;
            color: #e2e8f0;
        }

        .status {
            margin-bottom: 10px;
            color: #38bdf8;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .compiler-container {
                width: 94%;
            }

            #code {
                min-height: 300px;
            }

            textarea {
                font-size: 14px;
            }

            button {
                flex: 1;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>💻 Online C Compiler</h1>
        <p>Write, compile and run C programs directly in your browser.</p>
    </header>

    <main class="compiler-container">

        <div class="section-title">C Code</div>

        <textarea id="code">#include <stdio.h>

int main(void) {
    printf("Hello World\n");
    return 0;
}</textarea>

        <div class="buttons">
            <button id="runBtn">▶ Run Code</button>
            <button id="resetBtn">↻ Reset</button>
        </div>

        <div class="section-title">Program Input</div>

        <textarea
            id="input"
            placeholder="Enter input for your C program here..."
        ></textarea>

        <div class="section-title">Output</div>

        <div class="status" id="status">
            Ready
        </div>

        <div class="output-box" id="output">
            Output will appear here...
        </div>

    </main>

</body>
</html>
